<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>용어집 관리 — AI·IT를 읽어드립니다</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><header><a class="brand" href="/">AI·IT를 읽어드립니다</a><a class="small" href="/">용어집으로 돌아가기 ↗</a></header><main><div class="eyebrow">GLOSSARY EDITOR</div><h1 style="font-size:36px">나만의 용어집을 가꾸세요.</h1><p class="intro">용어와 정의를 추가하고 수정하면 홈페이지에 바로 반영됩니다.</p><p id="message" class="notice" role="status"></p><section class="panel" id="auth" hidden><h2 id="authTitle">관리자 로그인</h2><p id="authHelp" class="notice"></p><form id="authForm"><label for="password">비밀번호</label><input id="password" type="password" required maxlength="128" autocomplete="current-password"><div id="confirmWrap" hidden><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" maxlength="128" autocomplete="new-password"></div><div class="actions"><button class="primary" id="authSubmit">로그인</button></div></form></section><section id="editor" hidden><div class="actions"><button class="secondary" id="manageCategories">분야 관리</button><button class="primary" id="add">+ 용어 추가</button><button class="secondary" id="changePassword">비밀번호 변경</button><button class="secondary" id="export">JSON 백업</button><button class="secondary" id="refresh">목록 새로고침</button><button class="secondary" id="logout">로그아웃</button></div><div class="search"><input id="search" type="search" style="padding-left:20px" aria-label="편집할 용어 검색" placeholder="편집할 용어를 검색하세요"></div><p class="notice">↑ 위로 · ↓ 아래로 버튼으로 같은 분야 안에서 용어 순서를 바꿀 수 있습니다. 변경 즉시 홈페이지에 반영됩니다.</p><div class="bar" id="count"></div><section class="grid" id="grid"></section></section><dialog id="termDialog"><form id="termForm"><h2 id="termTitle">용어 추가</h2><label for="term">용어</label><input id="term" required maxlength="120"><label for="definition">정의</label><textarea id="definition" required maxlength="2000" rows="5"></textarea><label for="category">분야</label><select id="category" required aria-label="분야 선택"></select><p id="termMessage" class="notice" role="status"></p><div class="actions"><button class="primary" id="save">저장하고 반영</button><button type="button" class="secondary" id="cancel">취소</button></div></form></dialog><dialog id="passwordDialog"><form id="passwordForm"><h2>비밀번호 변경</h2><label for="current">현재 비밀번호</label><input id="current" type="password" required maxlength="128" autocomplete="current-password"><label for="newPassword">새 비밀번호 · 10자 이상</label><input id="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><label for="newConfirm">새 비밀번호 확인</label><input id="newConfirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><p id="passwordMessage" class="notice" role="status"></p><div class="actions"><button class="primary">비밀번호 변경</button><button type="button" class="secondary" id="cancelPassword">취소</button></div></form></dialog><dialog id="categoriesDialog"><form id="categoriesForm"><h2>분야 관리</h2><p class="notice">이름·설명·표시 순서를 편집하세요. 용어가 있는 분야는 먼저 용어를 옮긴 뒤 삭제할 수 있습니다.</p><div id="categoryRows"></div><button type="button" class="secondary" id="addCategory">+ 분야 추가</button><p id="categoriesMessage" class="notice" role="status"></p><div class="actions"><button class="primary" id="saveCategories">저장하고 반영</button><button type="button" class="secondary" id="cancelCategories">취소</button></div></form></dialog></main></body></html>
