<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f3ec"><title>관리자 — AI·IT를 읽어드립니다</title><link rel="stylesheet" href="/style.css">
<style>
.adm{max-width:760px;margin:auto;padding:48px 24px 60px}
.adm h1{font-size:32px;letter-spacing:-1.3px;margin:10px 0 8px}
.adm .lead{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 22px}
.box{background:#fffef9;border:1px solid var(--line);border-radius:14px;padding:28px}
.box label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.go{border:0;border-radius:10px;padding:14px 22px;font-size:15px;font-weight:700;background:var(--green);color:#fff;margin-top:14px}
.go:disabled{opacity:.6}
.err{color:#b0503a;font-size:13px;min-height:20px;margin:10px 0 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.menu a{display:block;background:#fffef9;border:1px solid var(--line);border-radius:14px;padding:26px;text-decoration:none;color:var(--ink);transition:border-color .2s,transform .2s}
.menu a:hover,.menu a:focus-visible{border-color:var(--green);transform:translateY(-2px);outline:none}
.menu .ic{font-size:13px;font-weight:700;color:var(--green);letter-spacing:1.5px}
.menu b{display:block;font-size:22px;margin:10px 0 8px;letter-spacing:-.6px}
.menu p{margin:0;font-size:13px;line-height:1.7;color:var(--muted)}
.out{margin-top:22px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.menu{grid-template-columns:1fr}}
</style></head><body>
<header><a href="/" class="brand">AI·IT를 읽어드립니다</a><a class="small" href="/">용어집으로 ↗</a></header>
<main class="adm">
 <section id="loginView" hidden>
  <div class="eyebrow">ADMIN</div>
  <h1>관리자 로그인</h1>
  <p class="lead">로그인하면 용어집 관리와 퀴즈 생성을 할 수 있어요.</p>
  <form class="box" id="form">
   <label for="pw">비밀번호</label>
   <input id="pw" type="password" required maxlength="128" autocomplete="current-password">
   <button class="go" id="submit">로그인</button>
   <p class="err" id="err" role="alert"></p>
  </form>
 </section>
 <section id="menuView" hidden>
  <div class="eyebrow">ADMIN</div>
  <h1>무엇을 할까요?</h1>
  <p class="lead">로그인되어 있어요. 아래 두 가지 중 하나를 고르세요. (8시간 동안 로그인이 유지됩니다)</p>
  <nav class="menu">
   <a href="/admin"><span class="ic">GLOSSARY</span><b>용어집 관리</b><p>용어·정의 추가와 수정, 분야 관리, 순서 바꾸기, 백업</p></a>
   <a href="/class"><span class="ic">QUIZ</span><b>퀴즈 생성</b><p>강의실 퀴즈 방을 만들어 QR을 띄우고, 학생들의 입장·진행·점수를 실시간으로 확인</p></a>
  </nav>
  <button class="out" id="logout">로그아웃</button>
 </section>
</main>
<footer class="site-credit">Provided by NoName Factory Inc.</footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const H = { 'content-type': 'application/json', 'x-malteut-admin': '1' };
  const view = auth => { $('loginView').hidden = auth; $('menuView').hidden = !auth; (auth ? $('menuView').querySelector('a') : $('pw')).focus(); };
  fetch('/api?op=status', { credentials: 'same-origin' }).then(r => r.json()).then(s => {
    if (!s.configured) { location.href = '/admin'; return; }   // 첫 비밀번호 설정은 기존 관리 화면에서
    view(s.authenticated);
  }).catch(() => { view(false); $('err').textContent = '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'; });
  $('form').onsubmit = async e => {
    e.preventDefault(); $('err').textContent = ''; $('submit').disabled = true;
    try {
      const r = await fetch('/api?op=login', { method: 'POST', headers: H, credentials: 'same-origin', body: JSON.stringify({ password: $('pw').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Error(j.error || '로그인하지 못했어요.');
      $('pw').value = ''; view(true);
    } catch (err) { $('err').textContent = err.message; $('pw').select(); }
    finally { $('submit').disabled = false; }
  };
  $('logout').onclick = async () => { await fetch('/api?op=logout', { method: 'POST', headers: H, credentials: 'same-origin', body: '{}' }).catch(() => {}); view(false); };
})();
</script>
</body></html>
